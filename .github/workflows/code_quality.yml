name: Code Quality
# ref: https://github.com/marketplace/actions/ansible-lint

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    # Important: This sets up your GITHUB_WORKSPACE environment variable
      - uses: actions/checkout@v4
      - name: Test Pyris deployment helper
        run: bash roles/pyris/tests/test_pyris_docker.sh
      - name: Install Ansible Core
        run: python -m pip install ansible-core
      - name: Test Pyris bootstrap state
        run: ansible-playbook roles/pyris/tests/test_bootstrap_state.yml
      - name: Run ansible-lint
        uses: ansible/ansible-lint@39ea20ef8957633d89c45485028b68e232a8c1c2
        with:
          requirements_file: "requirements.yml"
