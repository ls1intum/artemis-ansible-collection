name: Code Quality
# ref: https://github.com/marketplace/actions/ansible-lint

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    # Important: This sets up your GITHUB_WORKSPACE environment variable
      - uses: actions/checkout@v4
      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.8.0
        with:
          requirements_file: "requirements.yml"

  hyperion-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install configuration-test dependencies
        run: pip install ansible-core==2.19.13 PyYAML==6.0.3
      - name: Validate Hyperion role configuration
        run: python -m unittest discover -s tests -p 'test_hyperion_worker.py' -v
