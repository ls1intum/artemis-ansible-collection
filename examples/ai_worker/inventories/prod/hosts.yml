---
all:
  vars:
    artemis_hyperion_exercise_generation_enabled: false
    artemis_version: '{{ artemis_release_version }}'
    artemis_llm_cost: {}
    valkey:
      host: valkey-prod.example.invalid
      port: 6379
      username: artemis-prod
      password: '{{ vault_valkey_password }}'
    valkey_appendonly: true
    valkey_appendfsync: always
    valkey_maxmemory_policy: noeviction
  children:
    artemis_writers:
      vars:
        artemis_hyperion_enabled: false
      children:
        artemis_cores:
          vars:
            artemis_hyperion_enabled: true
            continuous_integration:
              localci:
                is_core_node: true
                is_build_agent: false
            version_control:
              localvc:
                url: https://artemis-prod.example.invalid
                repo_storage_base_path: /opt/artemis/repos
          hosts:
            core-prod.example.invalid:
              node_id: 1
    generation_workers:
      vars:
        ai_worker_dedicated_host: true
        ai_worker_directory: /opt/ai-worker-prod
        ai_worker_sandbox_image: '{{ ai_worker_release_sandbox_image }}'
        ai_worker_slots: 1
        ai_worker_model: qualified-prod-model
        ai_worker_model_base_url: https://model-prod.example.invalid/v1
        ai_worker_model_api_key: '{{ vault_ai_worker_model_api_key }}'
      hosts:
        worker-prod.example.invalid:
          ai_worker_id: generation-prod-1
