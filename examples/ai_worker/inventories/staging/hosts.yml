---
all:
  vars:
    artemis_hyperion_exercise_generation_enabled: true
    artemis_llm_cost: {}
    artemis_aiworker_ids: [generation-staging-1]
    ai_worker_model: qualified-staging-model
    valkey:
      host: valkey-staging.example.invalid
      port: 6379
      username: artemis-staging
      password: '{{ vault_valkey_password }}'
    valkey_appendonly: true
    valkey_appendfsync: always
    valkey_maxmemory_policy: noeviction
    artemis_hyperion_agent:
      max-job-duration: PT30M
      stale-job-timeout: PT35M
      max-tokens-per-job: 1500000
      default-profile: standard
      profiles:
        standard:
          model: '{{ ai_worker_model }}'
          context-window-tokens: 128000
    artemis_hyperion_generation:
      max-concurrent-jobs-per-core-node: 2
  children:
    artemis_writers:
      vars:
        artemis_hyperion_enabled: false
      children:
        artemis_cores:
          vars:
            artemis_hyperion_enabled: true
            continuous_integration:
              localci:
                is_core_node: true
                is_build_agent: false
            version_control:
              localvc:
                url: https://artemis-staging.example.invalid
                repo_storage_base_path: /opt/artemis/repos
          hosts:
            core-staging.example.invalid:
              node_id: 1
    generation_workers:
      vars:
        ai_worker_dedicated_host: true
        ai_worker_directory: /opt/ai-worker-staging
        ai_worker_provider: redis
        ai_worker_valkey: '{{ valkey }}'
        ai_worker_image: '{{ ai_worker_release_image }}'
        ai_worker_sandbox_image: '{{ ai_worker_release_sandbox_image }}'
        ai_worker_slots: 2
        ai_worker_memory: 4g
        ai_worker_cpus: 4
        ai_worker_model_base_url: https://model-staging.example.invalid/v1
        ai_worker_model_api_key: '{{ vault_ai_worker_model_api_key }}'
      hosts:
        worker-staging.example.invalid:
          ai_worker_id: generation-staging-1
