---
all:
  vars:
    artemis_hyperion_exercise_generation_enabled: true
    artemis_version: '{{ artemis_release_version }}'
    # The Artemis 10.8 catalog, shared by core and the workers. Generation presets need max-retries 0.
    artemis_llm:
      endpoints:
        generation:
          base-url: https://model-staging.example.invalid/v1
          api-key: '{{ vault_llm_api_key }}'
          max-retries: 0
      presets:
        generation: { endpoint: generation, model: qualified-staging-model, api: chat-completions }
    artemis_llm_assignments:
      hyperion.agent.llm-preset: generation
    valkey:
      host: valkey-staging.example.invalid
      port: 6379
      username: artemis-staging
      password: '{{ vault_valkey_password }}'
    valkey_appendonly: true
    valkey_appendfsync: always
    valkey_maxmemory_policy: noeviction
  children:
    artemis_writers:
      vars:
        artemis_hyperion_enabled: false
      children:
        artemis_cores:
          vars:
            artemis_hyperion_enabled: true
            continuous_integration:
              localci:
                is_core_node: true
                is_build_agent: false
            version_control:
              localvc:
                url: https://artemis-staging.example.invalid
                repo_storage_base_path: /opt/artemis/repos
          hosts:
            core-staging.example.invalid:
              node_id: 1
    generation_workers:
      vars:
        ai_worker_dedicated_host: true
        ai_worker_directory: /opt/ai-worker-staging
        ai_worker_slots: 2
      hosts:
        worker-staging.example.invalid:
          ai_worker_id: generation-staging-1
