---
# Core, Build Agents and AI workers run the same Artemis release image: ghcr.io/ls1intum/artemis:<version>.
artemis_release_version: "<artemis release tag>"
# Build with deployment/docker/hyperion/gradle-sandbox.Dockerfile of the same release and pin by digest.
ai_worker_release_sandbox_image: "registry.example/hyperion-sandbox@sha256:<64 hex digits>"
