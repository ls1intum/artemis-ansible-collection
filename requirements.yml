---
roles:
  - src: geerlingguy.docker

  - src: geerlingguy.mysql

  - name: cloudalchemy.mysqld_exporter
    src: https://github.com/ls1admin/ansible-mysqld_exporter.git

collections:
  - name: community.mysql
  - name: ansible.posix
  - name: community.docker
  # Used by the postgres_exporter role: community.postgresql to create the exporter's
  # database role, prometheus.prometheus for the exporter itself. The latter is the
  # maintained successor of the cloudalchemy roles, which upstream archived.
  # community.postgresql 5.0.0 for the `memberships` parameter of postgresql_membership.
  - name: community.postgresql
    version: ">=5.0.0"
  - name: prometheus.prometheus
