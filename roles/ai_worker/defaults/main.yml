---
# The supervisor controls Docker. This must be an isolated generation host/VM,
# never the Docker daemon of an Artemis core, database or ordinary build agent.
ai_worker_dedicated_host: false
ai_worker_id: ""
ai_worker_image: ""
ai_worker_sandbox_image: ""
ai_worker_workload: hyperion-generation
ai_worker_workload_version: 1
ai_worker_profile: java-gradle
ai_worker_docker_socket: /var/run/docker.sock
ai_worker_directory: /opt/ai-worker
ai_worker_slots: 1
ai_worker_runtime: runc
ai_worker_sandbox_memory_bytes: 2147483648
ai_worker_sandbox_cpu_quota: 200000
ai_worker_sandbox_pids: 256
ai_worker_memory: 2g
ai_worker_cpus: 2
# Match the core nodes' DistributedDataProvider; the worker never hosts a data member.
artemis_eureka_urls: "{% if registry.url is defined and registry.url is not none %}http://admin:${jhipster.registry.password}@{{ registry.url }}:8761/eureka/{% endif %}"
artemis_jhipster_registry_password: ""

ai_worker_model_base_url: ""
ai_worker_model: ""
ai_worker_model_api_key: ""
ai_worker_model_timeout: 5m
ai_worker_model_options: {}
ai_worker_microsoft_foundry: false
