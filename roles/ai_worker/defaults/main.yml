---
# The supervisor controls Docker. This must be an isolated generation host/VM,
# never the Docker daemon of an Artemis core, database or ordinary build agent.
ai_worker_dedicated_host: false
ai_worker_id: ""
# The normal Artemis image of the release, as for core and Build Agents.
ai_worker_image: "ghcr.io/ls1intum/artemis:{{ artemis_version | default('') }}"
# Empty: use Artemis's independently versioned default sandbox, as for Build Agent build images.
ai_worker_sandbox_image: ""
ai_worker_docker_socket: /var/run/docker.sock
ai_worker_network_mode: bridge
ai_worker_directory: /opt/ai-worker
ai_worker_slots: 1
ai_worker_runtime: runc
ai_worker_sandbox_memory_bytes: 2147483648
ai_worker_sandbox_cpu_quota: 200000
ai_worker_sandbox_pids: 256
# The Artemis image fixes a 5 GB maximum heap; leave room for metaspace, direct buffers and /tmp.
ai_worker_memory: 8g
ai_worker_cpus: 2
# Match the core nodes' DistributedDataProvider; the worker never hosts a data member.
artemis_eureka_urls: "{% if registry.url is defined and registry.url is not none %}http://admin:${jhipster.registry.password}@{{ registry.url }}:8761/eureka/{% endif %}"
artemis_jhipster_registry_password: ""

# The LLM catalog of Artemis 10.8 (artemis.llm: endpoints and presets). The worker resolves the presets that core assigns
# to exercise generation in its own catalog, so it uses the catalog of core. Those presets need max-retries 0, on the
# preset or its endpoint; Artemis checks this on core at startup and on the worker when a run starts.
ai_worker_llm: "{{ artemis_llm | default({}) }}"
