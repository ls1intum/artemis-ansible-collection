---
- name: Validate the isolated worker configuration
  ansible.builtin.assert:
    that:
      - ai_worker_dedicated_host | bool
      - ai_worker_docker_socket is match('^/[a-zA-Z0-9/_.-]+$')
      - ai_worker_id is match('^[a-zA-Z0-9_-]{1,64}$')
      - ai_worker_image is match('^[^\s@]*[^\s@:](?::[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|@sha256:[a-f0-9]{64})\Z')
      - ai_worker_sandbox_image | length == 0 or ai_worker_sandbox_image is match('^(?!sha256:)[^\s@]*[^\s@:](?::(?!latest$)[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|@sha256:[a-f0-9]{64})\Z')
      - ai_worker_slots is integer
      - ai_worker_slots | int >= 1
      - ai_worker_slots | int <= 16
      - ai_worker_sandbox_memory_bytes | int > 0
      - ai_worker_sandbox_cpu_quota | int > 0
      - ai_worker_sandbox_pids | int > 0
      - ai_worker_cpus | float > 0
      - ai_worker_runtime | length > 0
      - ai_worker_directory is match('^/[a-zA-Z0-9/_-]+$')
    fail_msg: Configure an isolated worker host, the Artemis release image (set artemis_version), an optional versioned sandbox override and shared Hazelcast/Eureka or Redis access.

- name: Stop on the worker model variables of Artemis 10.7
  ansible.builtin.assert:
    that:
      - ai_worker_model is not defined
      - ai_worker_model_base_url is not defined
      - ai_worker_model_api_key is not defined
      - ai_worker_model_timeout is not defined
      - ai_worker_model_options is not defined
      - ai_worker_microsoft_foundry is not defined
    fail_msg: >-
      Artemis 10.8 names every model by a preset under artemis.llm. Move the worker's model connection into the
      artemis_llm catalog that core uses and remove the ai_worker_model* and ai_worker_microsoft_foundry variables.

- name: Validate the LLM catalog of the worker without logging its keys
  ansible.builtin.assert:
    that:
      - ai_worker_llm is mapping
      - ai_worker_llm.endpoints | default({}, true) is mapping
      - ai_worker_llm.endpoints | default({}, true) | length > 0
      - ai_worker_llm.presets | default({}, true) is mapping
      - ai_worker_llm.presets | default({}, true) | length > 0
    fail_msg: Supply the artemis_llm catalog of core (endpoints and presets) to the worker; its API keys belong in Ansible Vault.
  no_log: true

- name: Check the shared Redis connection
  ansible.builtin.assert:
    that:
      - valkey.host | default('') | length > 0
      - valkey.port | default(0) | int > 0
      - valkey.port | int <= 65535
      - valkey.username | default('') | length > 0
      - valkey.password | default('') | length > 0
    fail_msg: Supply the same Valkey connection as core through Ansible Vault.
  when: valkey is defined and valkey is not none
  no_log: true

- name: Check the shared Eureka connection
  ansible.builtin.assert:
    that:
      - artemis_eureka_urls is match('^https?://')
      - artemis_jhipster_registry_password | length > 0
    fail_msg: Supply the same Eureka URL and registry password as core.
  when: valkey is not defined or valkey is none
  no_log: true
