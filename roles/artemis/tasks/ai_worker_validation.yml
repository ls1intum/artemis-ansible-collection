---
- name: Validate inventory-owned generation settings
  ansible.builtin.assert:
    that:
      - artemis_hyperion_agent is mapping
      - artemis_hyperion_generation is mapping
    fail_msg: Set artemis_hyperion_agent and artemis_hyperion_generation to YAML mappings.

- name: Require durable Redis coordination for AI Worker ownership
  ansible.builtin.assert:
    that:
      - valkey_appendonly | default(false) | bool
      - valkey_appendfsync | default('everysec') == 'always'
      - valkey_maxmemory_policy | default('noeviction') == 'noeviction'
    fail_msg: >-
      Redis-backed AI Worker ownership requires appendonly=true,
      appendfsync=always, and maxmemory-policy=noeviction on the
      authoritative store. Verify these effective settings before admission.
  when:
    - valkey is defined and valkey is not none
    - artemis_aiworker_enabled | bool or artemis_hyperion_exercise_generation_enabled | bool

- name: Check AI Worker destinations on generation coordinators
  ansible.builtin.assert:
    that:
      - artemis_aiworker_ids is sequence
      - artemis_aiworker_ids is not string
      - artemis_aiworker_ids is not mapping
      - artemis_aiworker_ids | length > 0
      - artemis_aiworker_ids | length <= 64
      - artemis_aiworker_ids | unique | list | length == artemis_aiworker_ids | length
      - artemis_aiworker_ids | select('match', '^[a-zA-Z0-9_-]{1,64}$') | list | length == artemis_aiworker_ids | length
    fail_msg: Configure distinct AI Worker IDs on every generation coordinator.
  when:
    - artemis_computed_is_core_node | bool
    - >-
      artemis_aiworker_enabled | bool or
      (artemis_hyperion_enabled | bool and artemis_hyperion_exercise_generation_enabled | bool and
      continuous_integration.localci is defined and continuous_integration.localci is not none and
      version_control.localvc is defined and version_control.localvc is not none)
