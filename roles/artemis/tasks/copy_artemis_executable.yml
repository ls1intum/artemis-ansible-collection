---
- name: Check Artemis version is set
  fail:
    msg: "No Artemis version is set!"
  when: artemis_version is undefined or artemis_version is none or artemis_version == ""

- name: Check restart_artemis is set.
  fail:
    msg: "restart_artemis has to be set when a new artemis version should be released"
  when: not (restart_artemis | bool)

- name: Check if version matches release pattern
  set_fact:
    is_release: "{{ artemis_version is match('^[0-9]+\\.[0-9]+(?:\\.[0-9]+)?\\Z') }}"

- name: "Copying Artemis.war to {{ artemis_working_directory }}/artemis.war.new ..."
  debug:
    msg: "Copying Artemis.war to {{ artemis_working_directory }}/artemis.war.new ..."

- name: Copy local Artemis.war to {{ artemis_working_directory }}
  become: true
  ansible.posix.synchronize:
    src: "{{ artemis_version }}"
    dest: "{{ artemis_working_directory }}/artemis.war.new"
    mode: push
    archive: true
    owner: false
    group: false
  when: not (is_release | bool)

- name: Set correct ownership and permissions on artemis.war.new
  become: true
  file:
    path: "{{ artemis_working_directory }}/artemis.war.new"
    owner: "{{ artemis_deployment_user_name }}"
    group: "{{ artemis_user_group }}"
    mode: "644"
  when: not (is_release | bool)

- name: Download Artemis.war to {{ artemis_working_directory }}
  become: true
  get_url:
    url: "{{ artemis_war_url }}"
    dest: "{{ artemis_working_directory }}/artemis.war.new"
    owner: "{{ artemis_deployment_user_name }}"
    group: "{{ artemis_user_group }}"
    mode: "644"
    force: true
  when: is_release | bool

# Pre-extract the freshly staged WAR into an exploded layout while the currently running instance
# keeps serving. Running from the exploded layout (java -jar app/artemis.war) avoids Spring Boot's
# nested-jar classloader, which dominates cold start (~38s -> ~25s). Doing the extraction here, before
# restart_artemis.yml stops the service, keeps the ~9s extraction out of the downtime window; only the
# fast swap into place happens while the service is down. Spring Boot's `extract` rejects a `.war.new`
# source name, so the staged file is first copied to a real `.war` name. Runs as root and hands the
# result to the service user so the artemis unit can read it.
- name: Pre-extract new WAR into an exploded layout (old instance keeps running)
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    src="{{ artemis_working_directory }}/artemis-extract-src.war"
    dest="{{ artemis_extracted_app_directory }}.new"
    rm -rf "$dest" "$src"
    cp "{{ artemis_working_directory }}/artemis.war.new" "$src"
    /usr/bin/java -Djarmode=tools -jar "$src" extract --destination "$dest"
    mv "$dest/artemis-extract-src.war" "$dest/artemis.war"
    rm -f "$src"
    chown -R {{ artemis_user_name }}:{{ artemis_user_group }} "$dest"
  args:
    executable: /bin/bash
  when:
    - download_artemis_application | bool
    - artemis_extract_war | bool
    - not ansible_check_mode
