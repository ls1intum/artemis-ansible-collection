---
- name: Validate isolated Hyperion generation on core nodes
  ansible.builtin.assert:
    that:
      - artemis_hyperion_enabled | bool
      - artemis_computed_is_core_node | bool
      - version_control.localvc is defined and version_control.localvc is not none
      - continuous_integration.localci is defined and continuous_integration.localci is not none
      - artemis_hyperion_workers.broker_url | default('') is match('^tcp://')
      - artemis_hyperion_workers.broker_url | default('') is search('[?&;]sslEnabled=true(?:[&;]|$)')
      - "'trustAll=true' not in artemis_hyperion_workers.broker_url | default('')"
      - "'verifyHost=false' not in artemis_hyperion_workers.broker_url | default('')"
      - artemis_hyperion_workers.user | default('') | length > 0
      - artemis_hyperion_workers.password | default('') | length > 0
      - artemis_hyperion_workers.ids | default([]) is sequence
      - artemis_hyperion_workers.ids | default([]) is not string
      - artemis_hyperion_workers.ids | default([]) is not mapping
      - artemis_hyperion_workers.ids | default([]) | length > 0
      - artemis_hyperion_workers.ids | length <= 64
      - artemis_hyperion_workers.ids | unique | length == artemis_hyperion_workers.ids | length
      - artemis_hyperion_workers.ids | select('match', '^[a-zA-Z0-9_-]{1,64}$') | list | length == artemis_hyperion_workers.ids | length
    fail_msg: Whole-exercise authoring requires an eligible core node and separate verified TLS broker credentials with explicit worker IDs.
  when: artemis_hyperion_exercise_generation_enabled | bool
  no_log: true

- name: Validate durable Redis coordination before enabling Hyperion
  ansible.builtin.assert:
    that:
      - valkey_appendonly | default(false) | bool
      - valkey_appendfsync | default('everysec') == 'always'
      - valkey_maxmemory_policy | default('noeviction') == 'noeviction'
    fail_msg: >-
      Redis-backed Hyperion requires appendonly=true, appendfsync=always and
      maxmemory-policy=noeviction on the authoritative store. Put these shared
      valkey_* settings on both the store and Artemis writer hosts, apply them
      to the store while writers are stopped, and verify the effective settings
      before enabling generation. Snapshot-only or everysec persistence can
      lose acknowledged slots. Automatic asynchronous failover is not qualified.
  when:
    - artemis_hyperion_exercise_generation_enabled | bool
    - valkey is defined and valkey is not none
