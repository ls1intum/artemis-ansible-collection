---
# Run on every role invocation, also on Docker hosts that only re-render artemis.env, because the templates no longer
# render these variables and their values would otherwise disappear silently.
- name: Check that the replaced LLM variables are not used
  ansible.builtin.fail:
    msg: >-
      These variables configured language models before Artemis 10.8 and are no longer rendered: {{ artemis_old_llm_variables | join(', ') }}.
      Configure the models in artemis_llm and assign them in artemis_llm_assignments, see the README of this role.
  vars:
    artemis_old_llm_variables: >-
      {{ (['spring_ai'] if spring_ai is defined else [])
         + (['artemis_llm_cost'] if artemis_llm_cost is defined else [])
         + (['deimos.llm'] if deimos.llm is defined else [])
         + ((weaviate | default({}, true)).keys()
            | select('in', ['open_ai_embedding_model', 'open_ai_base_url', 'gpu_api_key'])
            | map('regex_replace', '^', 'weaviate.') | list) }}
  when: artemis_old_llm_variables | length > 0

- name: Validate Course Home AI settings on core nodes
  ansible.builtin.assert:
    that:
      - artemis_course_home_ai_location | default('') in ['LOCAL', 'CLOUD']
      - course_home_preset in (artemis_llm | default({}, true)).get('presets', {})
    fail_msg: >-
      Set artemis_course_home_ai_location to LOCAL or CLOUD and assign an existing chat preset to
      course-home.ai.llm-preset in artemis_llm_assignments before enabling Course Home AI.
  vars:
    course_home_preset: "{{ (artemis_llm_assignments | default({}, true)).get('course-home.ai.llm-preset', '') }}"
  when:
    - artemis_course_home_ai_enabled | default(false) | bool
    - artemis_computed_is_core_node | bool

# Environment variable names lose the dashes and the case of map keys, so a header such as X-Api-Key would reach
# Artemis as xapikey.
- name: Check that no LLM endpoint sets custom headers on Docker hosts
  ansible.builtin.fail:
    msg: >-
      The LLM endpoint {{ item }} sets custom-headers, which the environment variables in artemis.env cannot carry with their
      exact names. Use an endpoint without custom headers on Docker hosts.
  loop: "{{ ((artemis_llm | default({}, true)).endpoints | default({}, true)).keys() | list }}"
  when:
    - use_docker | bool
    - "'custom-headers' in artemis_llm.endpoints[item]"
