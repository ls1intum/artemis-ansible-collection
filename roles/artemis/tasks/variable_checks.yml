---
##############################################################################
# Check Secrets
##############################################################################

- name: Check if database password is set
  fail:
    msg: "No database password is configured!"
  when:
    - artemis_database_password is undefined or artemis_database_password is none

- name: Check if artemis_internal_admin_password is set
  fail:
    msg: "No artemis_internal_admin_password is configured!"
  when:
    - artemis_internal_admin_password is undefined or artemis_internal_admin_password is none

- name: Check if artemis_jhipster_jwt is set
  fail:
    msg: "No artemis_jhipster_jwt is configured!"
  when:
    - artemis_jhipster_jwt is undefined or artemis_jhipster_jwt is none

- name: Check if artemis_jhipster_registry_password is set
  fail:
    msg: "No artemis_jhipster_registry_password is configured!"
  when:
    - artemis_jhipster_registry_password is undefined or artemis_jhipster_registry_password is none
    - is_multinode_install|bool

- name: Check Spring AI Azure OpenAI configuration completeness (optional)
  fail:
    msg: "spring_ai.azure_openai defined but missing one of: api_key, endpoint, deployment_name"
  when:
    - spring_ai is defined
    - spring_ai.azure_openai is defined
    - spring_ai.azure_openai.api_key is not defined
        or spring_ai.azure_openai.api_key is none
        or spring_ai.azure_openai.api_key | length == 0
        or spring_ai.azure_openai.endpoint is not defined
        or spring_ai.azure_openai.endpoint is none
        or spring_ai.azure_openai.endpoint | length == 0
        or spring_ai.azure_openai.deployment_name is not defined
        or spring_ai.azure_openai.deployment_name is none
        or spring_ai.azure_openai.deployment_name | length == 0

- name: Warn if Hyperion enabled but Spring AI Azure OpenAI not configured
  debug:
    msg: "Hyperion is enabled (artemis_hyperion_enabled=true) but spring_ai.azure_openai is not configured. Hyperion features may not work."
  when:
    - artemis_hyperion_enabled | default(false)
    - spring_ai is not defined or spring_ai.azure_openai is not defined

##############################################################################
# Check localci Variables
##############################################################################

- name: Check if is either build_agent or core_node
  fail:
    msg: "localci configuration is incomplete - Make sure that each node is either build agent or core node"
  when:
    - continuous_integration.localci is defined
    - not continuous_integration.localci.is_core_node | default(false) and not continuous_integration.localci.is_build_agent | default(false)
- name: Check that node 1 is a core_node
  fail:
    msg: "localci configuration is incomplete - Make sure that node 1 is a core_node"
  when:
    - continuous_integration.localci is defined
    - node_id is defined and node_id == 1 and not continuous_integration.localci.is_core_node | default(false)

# A local CI node refuses to start when a shared build agent git credential is configured: its build agents
# authenticate per build job, with the job's clone token over https or with an ssh key, so the pair grants nothing
# they need while being a single static secret that opens every repository. Caught here rather than at boot, so the
# play stops with the variable named instead of the service failing to come up after a deploy.
- name: Check that no shared build agent git credential is set where local CI runs
  fail:
    msg: >-
      version_control.localvc.build_agent_git_credentials must not be set on a node that runs local CI - Artemis
      refuses to start with it. Remove it and let the build agents authenticate per build job: set
      version_control.localvc.build_agent_use_ssh (preferred, each agent generates its own key pair), or leave it
      unset and they use the clone token of the build job they are running, which needs no configuration. The
      credential pair belongs only to a local VC node without local CI, which is the Jenkins with LocalVC setup.
  when:
    - version_control.localvc is defined and version_control.localvc is not none
    - version_control.localvc.build_agent_git_credentials is defined
    - continuous_integration.localci is defined and continuous_integration.localci is not none
    - artemis_computed_is_core_node
