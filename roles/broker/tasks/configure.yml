---
- name: Check if broker is installed
  become: true
  stat:
    path: "{{ activemq_working_directory }}"
  register: broker_install_result

- name: Create broker in {{ activemq_working_directory }} (NOT IDEMPOTENT)
  become: true
  command: ./artemis create --user {{ activemq_username }} --password {{ activemq_password }} --require-login --force {{ activemq_working_directory }}
  args:
    chdir: "{{ activemq_install_directory }}/apache-artemis-{{ activemq_version }}/bin"
  notify: Restart broker
  when: not broker_install_result.stat.exists or activemq_force_reinstall

- name: Copy primary broker.xml file
  become: true
  template:
    src: activemq_primary_broker.xml.j2
    dest: "{{ activemq_working_directory }}/etc/broker.xml"
    mode: "644"
  notify: Restart broker

- name: Set permissions for broker working directory
  become: true
  file:
    path: "{{ activemq_working_directory }}"
    state: directory
    recurse: true
    owner: "{{ artemis_user_name }}"
    group: "{{ artemis_user_group }}"
  notify: Restart broker

- name: Copy broker.service systemd configuration
  become: true
  template:
    src: activemq_broker.service.j2
    dest: "/etc/systemd/system/broker.service"
    mode: "644"
  notify: Restart broker

# The broker scripts and the command line utilities read ARTEMIS_HOME from separate profiles.
- name: Ensure correct broker version is installed
  become: true
  lineinfile:
    path: "{{ activemq_working_directory }}/etc/{{ item }}"
    regexp: "^ARTEMIS_HOME="
    line: "ARTEMIS_HOME='{{ activemq_install_directory }}/apache-artemis-{{ activemq_version }}'"
  loop:
    - artemis.profile
    - artemis-utility.profile
  notify: Restart broker

# The start script passes JAVA_ARGS_APPEND after JAVA_ARGS, so these values win over any heap flags in JAVA_ARGS.
# Managing the heap here keeps it correct when the instance is upgraded or the host's memory changes.
- name: Set the broker heap size
  become: true
  lineinfile:
    path: "{{ activemq_working_directory }}/etc/artemis.profile"
    regexp: "^JAVA_ARGS_APPEND="
    line: "JAVA_ARGS_APPEND=\"-Xms{{ activemq_heap_size_mb }}m -Xmx{{ activemq_heap_size_mb }}m\""
  vars:
    activemq_heap_size_mb: "{{ (activemq_system_ram_proportion * ansible_memory_mb.real.total) | int }}"
  notify: Restart broker

- name: Enable broker service
  become: true
  systemd:
    daemon_reload: true
    name: broker
    enabled: true
    masked: false
  notify: Restart broker
