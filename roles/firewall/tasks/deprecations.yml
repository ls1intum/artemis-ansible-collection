---
# The registry rule set was removed together with the registry role. 'broker' was an alias for it.
- name: Check that the removed registry rule set is not selected
  fail:
    msg: >-
      firewall_hostgroup '{{ firewall_hostgroup }}' selected the registry rule set, which was removed together with
      the registry role. Use 'default' instead - it keeps the wg0 interface open, so a message broker stays reachable
      over WireGuard, but no longer opens ports 80 and 443 to the management network.
  when: firewall_hostgroup in ['registry', 'broker']
