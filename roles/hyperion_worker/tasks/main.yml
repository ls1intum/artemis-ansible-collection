---
- name: Validate Hyperion worker inputs
  ansible.builtin.import_tasks: validate.yml
  tags: [validation]

- name: Inspect an existing worker before maintenance
  community.docker.docker_container_info:
    name: hyperion-worker
  register: hyperion_worker_existing
  become: true

- name: Require a drained maintenance window before touching a running worker
  ansible.builtin.assert:
    that:
      - hyperion_worker_maintenance_confirmed | bool or not (hyperion_worker_existing.exists and hyperion_worker_existing.container.State.Running)
    fail_msg: Drain authoring, verify no active assignments, and set hyperion_worker_maintenance_confirmed for this deployment.

- name: Inspect the dedicated Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: hyperion_worker_socket
  become: true

- name: Require a local Docker daemon
  ansible.builtin.assert:
    that:
      - hyperion_worker_socket.stat.exists
      - hyperion_worker_socket.stat.issock
    fail_msg: Provision Docker on this isolated host before deploying the worker.

- name: Preload the immutable sandbox image
  community.docker.docker_image:
    name: "{{ hyperion_worker_sandbox_image }}"
    source: pull
  become: true

- name: Create the private worker configuration directory
  ansible.builtin.file:
    path: "{{ hyperion_worker_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Render worker-only configuration and credentials
  ansible.builtin.template:
    src: application.yml.j2
    dest: "{{ hyperion_worker_directory }}/application.yml"
    owner: "1000"
    group: "1000"
    mode: "0400"
  register: hyperion_worker_configuration
  become: true
  no_log: true
  diff: false

- name: Run the isolated worker supervisor
  community.docker.docker_container:
    name: hyperion-worker
    image: "{{ hyperion_worker_image }}"
    state: started
    restart_policy: unless-stopped
    restart: "{{ hyperion_worker_configuration.changed }}"
    user: "1000:1000"
    groups: ["{{ hyperion_worker_socket.stat.gid | string }}"]
    read_only: true
    cap_drop: [ALL]
    security_opts: [no-new-privileges:true]
    memory: "{{ hyperion_worker_memory }}"
    cpus: "{{ hyperion_worker_cpus }}"
    pids_limit: 512
    stop_timeout: 150
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{ hyperion_worker_directory }}/application.yml:/config/application.yml:ro"
    env:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/application.yml
    log_driver: json-file
    log_options:
      max-size: 10m
      max-file: "3"
  become: true
