---
ansible_managed: "Ansible managed: Do not make changes here - they will be overwritten."

servers: []
#   - name:
#     ssl_certificate_path:
#     ssl_certificate_key_path:
#     default_server: false

redirects: []
#   - name:
#     ssl_certificate_path:
#     ssl_certificate_key_path:
#     default_server: true
#     to: "{{ artemis_url }}"

# Nodes for load balancing; Either define a host-group or manually list all nodes
# proxy_available_nodes: "{{ groups.artemisnodes }}" # will not work anymore
proxy_available_nodes:
  - hostname: 127.0.0.1

# Service Port on nodes for load balancing; If differing for each node fall back to
# manual list of proxy_available_nodes and comment out proxy_target_port variable declaration
proxy_target_port: 8080

# Port forwarding configuration of Artemis nodes for SSH Git communication with Artemis ICL LocalVC
proxy_forward_ssh: true

# Whether to announce the real ssh client to the Artemis nodes using the HAProxy PROXY protocol.
# Forwarding port 7921 at the TCP level otherwise hides the client, so every ssh connection appears to come from this
# proxy: git ssh rate limiting shares a single bucket across all users, and Artemis cannot check which address a build
# agent connects from.
# Only enable this together with version_control.localvc.ssh_proxy_protocol_trusted_sources on the Artemis nodes,
# listing this proxy. Enabling one half without the other breaks ssh in one direction or the other, which is why this
# defaults to false. Requires an Artemis version that supports the PROXY protocol on its ssh listener.
proxy_ssh_proxy_protocol: false

# Protocol used to communicate with nodes (either http or https)
proxy_node_protocol: http

# Used for the /mailto enpoint - Has to be a valid mail address.
proxy_mailto:
# /etc/nginx/sites-available/artemis.conf
# Uncomment to change load balancing method from default (which is round robin)
# Can be "least_conn" or "ip_hash"
# proxy_load_balancing_method: ip_hash

proxy_resolver: "127.0.0.53 valid=300s"

proxy_worker_rlmmiit_nofile: 30000
proxy_worker_connections: 20000
proxy_server_names_hash_bucket_size: 256

proxy_generate_dh_param: true

proxy_send_timeout: "900s"
proxy_read_timeout: "900s"
fastcgi_send_timeout: "900s"
fastcgi_read_timeout: "900s"

# Answer the client bundle from nginx's own cache instead of proxying every request to a node.
#
# Everything cached is versioned in its URL - Angular emits content-hashed names for JavaScript, CSS and
# the media they reference, and the translation loader appends the build's I18N_HASH as a query
# parameter - so a cached copy cannot go stale: a new build is a new URL, and the entries the old build
# left behind are never asked for again.
#
# Worth having because nothing else absorbs that load. Artemis serves its own static content, and
# compresses it (server.compression), so without a cache every chunk request costs a node a read out of
# the WAR and a gzip. Measured against a cohort of 2000 simulated students that is roughly 1.2 million
# application requests in a few minutes for a few hundred distinct files.
proxy_cache_client_bundle: true
# Put this on a disk with room to spare; it is read on every cache hit. A build's bundle is tens of
# megabytes, so the ceiling below is generous rather than tight and exists only to bound the disk.
proxy_cache_client_bundle_path: /var/cache/nginx/artemis-assets
proxy_cache_client_bundle_max_size: 2g
# How long an entry survives without being asked for. Long enough to still be warm between lectures.
proxy_cache_client_bundle_inactive: 30d
# Shared memory for the keys, not the bodies. Far more than the few hundred entries a build needs.
proxy_cache_client_bundle_keys_zone_size: 20m
# Only applies to responses that arrive without caching directives of their own; Artemis sends
# Cache-Control on these paths and stays authoritative. This is the floor, not the policy.
proxy_cache_client_bundle_valid: 30d
# How long a request waits for another request to finish filling the same entry before giving up and
# going to a node itself. Generous, because the alternative at the start of a lecture is the whole
# cohort going upstream at once, which is the thing the cache exists to prevent.
proxy_cache_client_bundle_lock_timeout: 30s

# IPs exempt from the git and login rate limits (e.g., benchmark servers). Add both address families
# for a dual-stack host: the exemption matches the address nginx actually sees, so listing only the IPv4
# silently leaves an IPv6 client throttled. Account recovery and registration stay limited for everyone.
proxy_rate_limit_exempt_ips: []
#   - ip: "131.159.89.112"
#     comment: "Benchmark server"
#   - ip: "2a09:80c0:89::112"
#     comment: "Benchmark server (IPv6)"
