---
ansible_managed: "Ansible managed: Do not make changes here - they will be overwritten."

# defaults file for storage-provider
artemis_uid: 1337
artemis_gid: 1337
artemis_user: artemis
artemis_group: artemis

# Storage server definition
storage_export: /srv/artemis

# Storage Network
storage_network: "fcfe:0:0:0:0:0:0:0/96"
storage_server_address: "fcfe:0:0:0:0:0:9:1"

# Units that must have finished before nfsd starts, because they bring up storage_server_address.
# nfsd is pinned to that one address, so it cannot bind until the interface carrying it exists, and
# `network-online.target` does not wait for WireGuard. Set to an empty list on a host where the storage
# address belongs to an interface systemd already waits for.
storage_nfs_after_units:
  - wg-quick@wg0.service
