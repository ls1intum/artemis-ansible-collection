---
# handlers file for storage-provider

- name: Restart nfs-server
  service:
    name: "nfs-server"
    state: "restarted"
    enabled: true
  become: true

- name: Reload systemd and restart nfs-server
  become: true
  ansible.builtin.systemd_service:
    name: "nfs-server"
    state: "restarted"
    enabled: true
    daemon_reload: true
