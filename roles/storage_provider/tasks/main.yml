---
# tasks file for storage-provider

- name: Ensure group {{ artemis_group }} exists
  become: true
  group:
    name: "{{ artemis_group }}"
    gid: "{{ artemis_gid }}"
    state: present

- name: Ensure user {{ artemis_user }} exists
  become: true
  user:
    name: "{{ artemis_user }}"
    state: present
    uid: "{{ artemis_uid }}"
    group: "{{ artemis_group }}"

- name: Install NFS server
  become: true
  apt:
    name: nfs-kernel-server
    state: "present"

- name: Make sure the export exists
  become: true
  file:
    path: "{{ storage_export }}"
    state: directory
    owner: "{{ artemis_user }}"
    group: "{{ artemis_group }}"

- name: Ensure the nfs-server drop-in directory exists
  become: true
  file:
    path: /etc/systemd/system/nfs-server.service.d
    state: directory
    owner: root
    group: root
    mode: "755"
  when: storage_nfs_after_units | length > 0

- name: Order nfs-server after the interface carrying the storage address
  become: true
  template:
    src: nfs-server-wait-for-address.conf.j2
    dest: /etc/systemd/system/nfs-server.service.d/10-wait-for-address.conf
    owner: root
    group: root
    mode: "644"
  when: storage_nfs_after_units | length > 0
  notify: Reload systemd and restart nfs-server

- name: Configure NFS Daemon
  become: true
  template:
    src: nfs.conf.j2
    dest: /etc/nfs.conf
    owner: root
    group: root
    mode: "644"
  notify: Restart nfs-server

- name: Configure export
  become: true
  template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "644"
  notify: Restart nfs-server
