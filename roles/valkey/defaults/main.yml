---
ansible_managed: "Ansible managed: Do not make changes here - they will be overwritten."

# Connection contract shared with the artemis role. Ansible replaces dictionaries
# wholesale, so anything defined here is lost as soon as `valkey:` is set in group_vars.
# Only the keys the artemis role also reads live in this dict - every operational
# setting is a flat `valkey_*` variable so it keeps its default.
valkey:
  username: artemis
  password: #FIXME
  admin_username: admin
  admin_password: #FIXME
  port: 6379

##############################################################################
# Installation
##############################################################################

# "tarball" installs the official prebuilt release from download.valkey.io.
# Ubuntu 24.04 only has Valkey 7.2 in universe, so the packages are not an
# option for a 9.x deployment - see README.md for which release ships what.
# "package" installs valkey_packages from the distribution instead.
valkey_install_method: tarball

valkey_version: "9.1.2"
valkey_minimum_version: "9.0.0"

# Upstream builds one tarball per distribution codename; a noble build also runs
# on later releases, but keep this matched to the host where you can.
valkey_tarball_distro: noble
valkey_tarball_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'x86_64' }}"
valkey_tarball_name: "valkey-{{ valkey_version }}-{{ valkey_tarball_distro }}-{{ valkey_tarball_arch }}"
valkey_tarball_url: "https://download.valkey.io/releases/{{ valkey_tarball_name }}.tar.gz"
# Pinned, so a swapped or truncated artifact fails the play instead of being
# installed. Update together with valkey_version - upstream publishes the digest
# at <tarball url>.sha256.
valkey_tarball_checksums:
  x86_64: "sha256:0d2a79936cbafa5f527a5175536bb17bd3f767f95f53529e59dddfacf762eec0"
  arm64: "sha256:eb601c28401d06d68d3fcb526645c4a01078c12d89de5fc70f5674c8a27bd2fd"
valkey_tarball_checksum: "{{ valkey_tarball_checksums[valkey_tarball_arch] }}"

# Every version is unpacked into its own directory below valkey_install_directory
# and reached through symlinks, so a rollback is a valkey_version change and the
# previous binaries are still there.
valkey_install_directory: /opt/valkey
valkey_bin_directory: /usr/local/bin
valkey_binaries:
  - valkey-server
  - valkey-cli
  - valkey-check-rdb
  - valkey-check-aof
  - valkey-benchmark

# Only used with valkey_install_method: package. `valkey-server` is the daemon,
# `valkey-tools` ships valkey-cli.
valkey_packages:
  - valkey-server
  - valkey-tools
valkey_package_state: present
valkey_apt_cache_valid_time: 3600

# Paths and unit name follow the Debian/Ubuntu packaging in both install methods,
# so an operator finds the same layout either way.
valkey_service_name: valkey-server
valkey_user: valkey
valkey_group: valkey
valkey_config_file: /etc/valkey/valkey.conf
valkey_data_directory: /var/lib/valkey
valkey_log_directory: /var/log/valkey
valkey_log_file: "{{ valkey_log_directory }}/valkey-server.log"
valkey_pid_file: /run/valkey/valkey-server.pid
valkey_server_binary: "{{ (valkey_bin_directory ~ '/valkey-server') if valkey_install_method == 'tarball' else '/usr/bin/valkey-server' }}"

# Log rotation, installed with the tarball method only - the package brings its
# own /etc/logrotate.d/valkey-server.
valkey_logrotate_frequency: weekly
valkey_logrotate_count: 12

##############################################################################
# Network
##############################################################################

# Address Valkey listens on in addition to loopback. Deliberately not optional
# (no "-" prefix): if wg0 is not up yet the service fails and systemd retries
# until the interface exists, instead of silently coming up unreachable for the
# whole cluster.
valkey_wireguard_address: "{{ wireguard_interface_address }}"

valkey_tcp_backlog: 511
# 24 nodes x Redisson connection pools add up quickly; keep well above the
# expected peak and make sure valkey_nofile_limit stays above this value.
valkey_maxclients: 10000
valkey_nofile_limit: 65535

# Restart backoff for the systemd drop-in. The mandatory WireGuard bind means
# the service legitimately fails while wg0 is down, so the unit must keep
# retrying instead of hitting systemd's default start rate limit.
valkey_restart_sec: 5
# Ordering only, no dependency: if the unit does not exist on this host systemd
# ignores it, and the bind fails loudly either way.
valkey_after_units: wg-quick@wg0.service

##############################################################################
# Memory
##############################################################################

# Hard cap so Valkey fails loudly instead of being OOM-killed. Set to roughly
# 60-70% of the RAM available to Valkey on this host.
valkey_maxmemory: 4gb
# "noeviction" on purpose: Redisson locks, the LocalCI build queue and the
# websocket bookkeeping are not disposable cache entries - evicting them
# corrupts cluster coordination silently. Hitting the limit must be an error.
valkey_maxmemory_policy: noeviction

##############################################################################
# Persistence
##############################################################################

valkey_persistence_enabled: true
valkey_save: "900 1 300 10 60 10000"
valkey_appendonly: false
# "no" keeps Valkey writable when a snapshot fails (full disk, bad permissions).
# With the default "yes" a failed BGSAVE puts every write into MISCONF and takes
# the whole Artemis cluster down until an operator intervenes.
valkey_stop_writes_on_bgsave_error: false

##############################################################################
# ACL
##############################################################################

# Application user: all keys and pub/sub channels, minus the administrative and
# destructive commands. The additions are the read-only bits Lettuce and Redisson
# need on connect, plus the whole CLIENT container except the subcommands that can
# disrupt other clients - Redisson uses CLIENT LIST, and CLIENT TRACKING if local
# cached maps are enabled, so allowing subcommands one at a time just defers the
# next NOPERM. Verify a change with:
#   ACL DRYRUN artemis <command> [args]
# and check `ACL LOG` on the server when something breaks in production.
valkey_artemis_acl_rules: >-
  ~* &* +@all -@admin -@dangerous
  +info +config|get +sort_ro +role +module|list
  +client -client|kill -client|pause -client|unpause
  -client|unblock -client|no-evict -client|no-touch

# Administrative user: everything. Valkey has no source-address ACL, so this is a
# privilege boundary, not a network boundary - see README.md.
valkey_admin_acl_rules: "~* &* +@all"

##############################################################################
# Keyspace notifications
##############################################################################

valkey_notify_keyspace_events: lshKE

##############################################################################
# Host tuning
##############################################################################

# vm.overcommit_memory=1 is required for BGSAVE: without it the fork can fail on
# a host with little free memory and persistence stops working silently.
valkey_tune_host: true
valkey_somaxconn: 1024
