---
- name: Verify build log storage configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/artemis/defaults/main.yml
  vars:
    artemis_computed_is_core_node: true
    artemis_computed_uses_hazelcast: false
    artemis_operator_name: Example operator
    artemis_operator_admin_name: Example administrator
    artemis_university_name: Example university
    continuous_integration:
      localci:
        is_core_node: true
        is_build_agent: false
    is_multinode_install: true
  tasks:
    - name: Verify native deployments share both build log stores
      ansible.builtin.assert:
        that:
          - config.artemis['build-logs-path'] == item + '/build-logs'
          - config.artemis.get('failed-build-logs-path') == item + '/failed-build-logs'
      vars:
        artemis_repo_basepath: "{{ item }}"
        config: "{{ lookup('ansible.builtin.template', '../roles/artemis/templates/application-prod.yml.j2') | from_yaml }}"
      loop:
        - /mnt/shared/artemis
        - /opt/artemis/data
