---
- name: Verify the LLM catalog and preset assignments
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/artemis/defaults/main.yml
  vars:
    artemis_computed_is_core_node: true
    artemis_operator_name: Example operator
    artemis_operator_admin_name: Example administrator
    artemis_university_name: Example university
    continuous_integration:
      localci:
        is_core_node: true
        is_build_agent: false
    is_multinode_install: true
    deimos: {}
    artemis_llm:
      endpoints:
        logos:
          base-url: https://logos.example.org/v1
          api-key: "secret: with colon"
          prices-usd-per-million:
            - { model: gpt-6.1-terra, input: 1.0, output: 5.0 }
      presets:
        large: { endpoint: logos, model: gpt-6.1-terra, api: responses, reasoning-effort: medium }
        embed: { endpoint: logos, model: Qwen/Qwen3-Embedding-8B, api: embeddings }
    artemis_llm_assignments:
      hyperion.llm-presets.default: large
      hyperion.llm-presets.faq-rewrite: large
      weaviate.embedding-llm-preset: embed
      deimos.llm-preset: large
    yaml_text: "{{ lookup('ansible.builtin.template', '../roles/artemis/templates/application-prod.yml.j2') }}"
    env_lines: "{{ lookup('ansible.builtin.template', '../roles/artemis/templates/artemis.env.j2').splitlines() }}"
  tasks:
    - name: Verify the YAML configuration
      ansible.builtin.assert:
        that:
          # from_yaml keeps only the last of two equal keys, so count the llm lines in the text
          - yaml_text.splitlines() | select('match', '^  llm:$') | list | length == 1
          - config.artemis.llm.keys() | list == ['endpoints', 'presets']
          - config.artemis.llm.endpoints.logos['base-url'] == 'https://logos.example.org/v1'
          - "config.artemis.llm.endpoints.logos['api-key'] == 'secret: with colon'"
          - config.artemis.llm.endpoints.logos['prices-usd-per-million'][0].model == 'gpt-6.1-terra'
          - config.artemis.llm.presets.large.model == 'gpt-6.1-terra'
          - config.artemis.llm.presets.embed.model == 'Qwen/Qwen3-Embedding-8B'
          - config.artemis['hyperion.llm-presets.default'] == 'large'
          - config.artemis['weaviate.embedding-llm-preset'] == 'embed'
          - config.artemis['deimos.llm-preset'] == 'large'
          - config.artemis.deimos.keys() | list == ['enabled']
          - config.spring.ai is not defined
      vars:
        config: "{{ yaml_text | from_yaml }}"

    - name: Verify the environment variables
      ansible.builtin.assert:
        that:
          - "\"ARTEMIS_LLM_ENDPOINTS_LOGOS_BASEURL='https://logos.example.org/v1'\" in env_lines"
          - "\"ARTEMIS_LLM_ENDPOINTS_LOGOS_APIKEY='secret: with colon'\" in env_lines"
          - "\"ARTEMIS_LLM_ENDPOINTS_LOGOS_PRICESUSDPERMILLION_0_MODEL='gpt-6.1-terra'\" in env_lines"
          - "\"ARTEMIS_LLM_PRESETS_LARGE_REASONINGEFFORT='medium'\" in env_lines"
          - "\"ARTEMIS_LLM_PRESETS_EMBED_MODEL='Qwen/Qwen3-Embedding-8B'\" in env_lines"
          - "\"ARTEMIS_HYPERION_LLMPRESETS_DEFAULT='large'\" in env_lines"
          - "\"ARTEMIS_HYPERION_LLMPRESETS_FAQREWRITE='large'\" in env_lines"
          - "\"ARTEMIS_WEAVIATE_EMBEDDINGLLMPRESET='embed'\" in env_lines"
          - "\"ARTEMIS_DEIMOS_LLMPRESET='large'\" in env_lines"
          - "\"ARTEMIS_DEIMOS_ENABLED='true'\" in env_lines"
          - env_lines | select('match', '^ARTEMIS_LLM_') | select('search', '^\\s|\\s$') | list | length == 0
          - env_lines | select('match', '^(SPRING_AI_|ARTEMIS_LLM_MODELCOSTS_|ARTEMIS_DEIMOS_LLM_)') | list | length == 0

- name: Verify the configuration without a catalog
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/artemis/defaults/main.yml
  vars: &without_catalog_vars
    artemis_computed_is_core_node: true
    artemis_operator_name: Example operator
    artemis_operator_admin_name: Example administrator
    artemis_university_name: Example university
    continuous_integration:
      localci:
        is_core_node: true
        is_build_agent: false
    is_multinode_install: true
    yaml_text: "{{ lookup('ansible.builtin.template', '../roles/artemis/templates/application-prod.yml.j2') }}"
    env_lines: "{{ lookup('ansible.builtin.template', '../roles/artemis/templates/artemis.env.j2').splitlines() }}"
  tasks: &without_catalog_tasks
    - name: Verify that no llm map and no LLM environment variables are rendered
      ansible.builtin.assert:
        that:
          - yaml_text.splitlines() | select('match', '^  llm:$') | list | length == 0
          - (yaml_text | from_yaml).artemis.llm is not defined
          - env_lines | select('match', '^ARTEMIS_LLM_') | list | length == 0

- name: Verify the configuration with an empty catalog
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/artemis/defaults/main.yml
  vars:
    <<: *without_catalog_vars
    artemis_llm: {}
  tasks: *without_catalog_tasks

- name: Verify the configuration with a blank assignments block
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/artemis/defaults/main.yml
  vars:
    <<: *without_catalog_vars
    artemis_llm_assignments:
  tasks: *without_catalog_tasks

# Runs the role's entry point without setup_system and update_artemis_config, as a Docker host that only re-renders
# artemis.env does, so the check must not depend on those flags.
- name: Verify that the variables of older Artemis versions stop the role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    setup_system: false
    update_artemis_config: false
    restart_artemis: false
    use_docker: false
    spring_ai:
      azure_openai: { api_key: old, endpoint: https://logos.example.org/v1, deployment_name: gpt-5.4-mini }
    artemis_llm_cost:
      gpt-5-mini: { input_cost_per_million_eur: 0.23, output_cost_per_million_eur: 1.84 }
    deimos:
      llm: { base_url: https://logos.example.org/v1, api_key: old, model: gpt-oss }
    weaviate:
      enabled: true
      open_ai_base_url: https://logos.example.org/
      # a value that cannot be resolved any more must not hide the name of the replaced key
      gpu_api_key: "{{ removed_vault_value }}"
  tasks:
    - name: Run the role's entry point
      block:
        - name: Include the role's entry point
          ansible.builtin.include_tasks: ../roles/artemis/tasks/main.yml
        - name: Fail because the check did not stop the role
          ansible.builtin.fail:
            msg: The replaced LLM variables did not stop the role
      rescue:
        - name: Verify that the check of the replaced LLM variables stopped the role
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Check that the replaced LLM variables are not used'
              - "'spring_ai, artemis_llm_cost, deimos.llm, weaviate.open_ai_base_url, weaviate.gpu_api_key' in ansible_failed_result.msg"

- name: Verify that custom headers stop the role on Docker hosts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    use_docker: true
    artemis_llm:
      endpoints:
        plain: { base-url: https://logos.example.org/v1 }
        gateway: { base-url: https://gateway.example.org/v1, custom-headers: { X-Api-Key: secret } }
  tasks:
    - name: Run the LLM checks
      block:
        - name: Include the LLM checks of the role
          ansible.builtin.include_tasks: ../roles/artemis/tasks/llm_checks.yml
        - name: Fail because the check did not stop the role
          ansible.builtin.fail:
            msg: The custom headers did not stop the role
      rescue:
        - name: Verify that the check of the custom headers stopped the role for the gateway endpoint
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Check that no LLM endpoint sets custom headers on Docker hosts'
              - ansible_failed_result.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list == ['gateway']

- name: Verify that custom headers are allowed without Docker
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    use_docker: false
    artemis_llm:
      endpoints:
        gateway: { base-url: https://gateway.example.org/v1, custom-headers: { X-Api-Key: secret } }
  tasks:
    - name: Include the LLM checks of the role
      ansible.builtin.include_tasks: ../roles/artemis/tasks/llm_checks.yml
