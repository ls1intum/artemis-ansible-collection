---
- name: Verify exercise sharing configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/artemis/defaults/main.yml
  vars:
    artemis_computed_is_core_node: true
    artemis_operator_name: Example operator
    artemis_operator_admin_name: Example administrator
    artemis_university_name: Example university
    continuous_integration:
      localci:
        is_core_node: true
        is_build_agent: false
    is_multinode_install: true
    sharing_connection:
      url: https://exchange.example.org
      apikey: test-key
      actionname: Export to test
    config: "{{ lookup('ansible.builtin.template', '../roles/artemis/templates/application-prod.yml.j2') | from_yaml }}"
    env_lines: "{{ lookup('ansible.builtin.template', '../roles/artemis/templates/artemis.env.j2').splitlines() | select('match', '^ARTEMIS_SHARING_') | list }}"
  tasks:
    - name: Verify that omitting sharing preserves the application default
      ansible.builtin.assert:
        that:
          - config.artemis.sharing is not defined
          - env_lines == []

    - name: Verify enabled sharing for existing and explicitly enabled inventories
      vars:
        sharing: "{{ sharing_connection | combine(item) }}"
        expected_config:
          enabled: true
          serverurl: https://exchange.example.org
          apikey: test-key
          actionname: Export to test
        expected_env:
          - "ARTEMIS_SHARING_ENABLED='true'"
          - "ARTEMIS_SHARING_SERVERURL='https://exchange.example.org'"
          - "ARTEMIS_SHARING_APIKEY='test-key'"
          - "ARTEMIS_SHARING_ACTIONNAME='Export to test'"
      ansible.builtin.assert:
        that:
          - config.artemis.sharing == expected_config
          - env_lines | sort == expected_env | sort
      loop:
        - {}
        - { enabled: true }

    - name: Verify disabled sharing with and without connection details
      vars:
        sharing: "{{ item | combine({'enabled': false}) }}"
      ansible.builtin.assert:
        that:
          - "config.artemis.sharing == {'enabled': false}"
          - env_lines == ["ARTEMIS_SHARING_ENABLED='false'"]
      loop:
        - "{{ sharing_connection }}"
        - {}
